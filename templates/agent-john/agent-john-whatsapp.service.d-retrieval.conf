# systemd drop-in: Agent John WhatsApp retrieval pilot
# Install as:
#   /etc/systemd/system/agent-john-whatsapp.service.d/retrieval.conf
# Owner: operium/docs/agent-john-whatsapp-retrieval.md
#
# shadow = Guide remains the live outbound answer; librarian runs for compare only.
# Rollback: delete this drop-in (or set RETRIEVAL=guide), daemon-reload, restart.

[Service]
Environment=AGENT_JHN_WHATSAPP_RETRIEVAL=shadow
Environment=AGENT_JHN_WHATSAPP_GATEWAY_URL=http://127.0.0.1:8790
Environment=AGENT_JHN_WHATSAPP_GUIDE_URL=http://127.0.0.1:8791/guide/chat
Environment=AGENT_JHN_WHATSAPP_GUIDE_TIMEOUT_MS=45000
