<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="description" content="La Nasa step 1+2 — Fractanet control-room home and fleet view">
  <title>La Nasa — Fractanet</title>
  <style>
    :root {
      --bg: #0b1118; --panel: #121c27; --line: #26384a; --text: #e8eef5;
      --muted: #91a4b7; --ok: #52d18b; --bad: #ff6b72; --accent: #73b7ff; --warn: #f0c14b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(145deg, #0b1118, #101c28);
      color: var(--text);
      font: 14px/1.3 system-ui, sans-serif;
    }
    main {
      height: 100%; max-height: 100vh; width: 100%;
      padding: 0.5rem 0.7rem 0.4rem;
      display: flex; flex-direction: column; gap: 0.35rem; overflow: hidden;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 0.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.35rem; flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .tagline { margin: 0.05rem 0 0; color: var(--muted); font-size: 0.72rem; }
    h2 {
      margin: 0 0 0.3rem; font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .muted { color: var(--muted); }
    #flash { flex: 0 0 auto; min-height: 0.95rem; font-size: 0.72rem; color: var(--muted); }
    #flash.ok { color: var(--ok); } #flash.err { color: var(--bad); } #flash.busy { color: var(--warn); }
    .grid {
      flex: 1 1 auto; min-height: 0;
      display: grid; grid-template-columns: 1fr 1.15fr; gap: 0.5rem; overflow: hidden;
    }
    .card {
      background: rgba(18, 28, 39, 0.92); border: 1px solid var(--line);
      border-radius: 8px; padding: 0.45rem 0.55rem; min-height: 0;
      overflow: hidden; display: flex; flex-direction: column;
    }
    .card.pulse { border-color: var(--accent); }
    .fleet-list { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .node-row {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.32rem 0.25rem; border-bottom: 1px solid var(--line);
      cursor: pointer; font-size: 0.88rem; border-radius: 4px;
    }
    .node-row:last-child { border-bottom: 0; }
    .node-row:hover, .node-row:focus { background: rgba(115, 183, 255, 0.08); outline: none; }
    .node-row.selected { background: rgba(115, 183, 255, 0.16); }
    .dot {
      width: 0.55rem; height: 0.55rem; border-radius: 50%;
      background: var(--muted); flex: none;
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(82, 209, 139, 0.4); }
    .dot.bad { background: var(--bad); }
    .node-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .node-row .meta { color: var(--muted); font-size: 0.75rem; flex: 0 0 auto; }
    .detail { flex: 1; min-height: 0; overflow: auto; font-size: 0.8rem; padding-right: 0.1rem; }
    .detail dl {
      margin: 0; display: grid; grid-template-columns: 6.2rem 1fr; gap: 0.15rem 0.35rem;
    }
    .detail dt { color: var(--muted); }
    .detail dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .zoom-head {
      display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.35rem;
      flex-wrap: wrap;
    }
    .zoom-title { font-size: 1rem; font-weight: 700; margin: 0; }
    .zoom-sub { color: var(--muted); font-size: 0.72rem; width: 100%; margin: 0; }
    .badge {
      display: inline-block; font-size: 0.68rem; font-weight: 700;
      padding: 0.1rem 0.4rem; border-radius: 999px; border: 1px solid var(--line);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge.ok { color: var(--ok); border-color: rgba(82, 209, 139, 0.45); background: rgba(82, 209, 139, 0.1); }
    .badge.bad { color: var(--bad); border-color: rgba(255, 107, 114, 0.45); background: rgba(255, 107, 114, 0.1); }
    .badge.warn { color: var(--warn); border-color: rgba(240, 193, 75, 0.45); background: rgba(240, 193, 75, 0.1); }
    .badge.muted { color: var(--muted); }
    .sec { margin-top: 0.4rem; }
    .sec > h3 {
      margin: 0 0 0.2rem; font-size: 0.65rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15rem 0.4rem; border-radius: 5px; border: 1px solid var(--line);
      background: #0b1118; font-size: 0.72rem; max-width: 100%;
    }
    .chip .k { color: var(--muted); }
    .chip .v { font-weight: 600; }
    .chip.ok { border-color: rgba(82, 209, 139, 0.35); }
    .chip.bad { border-color: rgba(255, 107, 114, 0.4); }
    .chip.skip { opacity: 0.55; }
    .svc {
      display: grid; grid-template-columns: 1fr auto auto; gap: 0.2rem 0.4rem;
      align-items: center; padding: 0.18rem 0; border-bottom: 1px solid var(--line);
      font-size: 0.75rem;
    }
    .svc:last-child { border-bottom: 0; }
    .svc .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .svc .lat { color: var(--muted); font-variant-numeric: tabular-nums; }
    details.raw {
      margin-top: 0.35rem; font-size: 0.72rem; color: var(--muted);
    }
    details.raw summary { cursor: pointer; color: var(--accent); user-select: none; }
    details.raw pre {
      margin: 0.3rem 0 0; padding: 0.3rem; background: #0b1118;
      border-radius: 4px; font-size: 0.65rem; max-height: 7rem; overflow: auto;
      color: var(--muted); white-space: pre-wrap; word-break: break-all;
    }
    .links { display: flex; flex-wrap: wrap; gap: 0.35rem 0.7rem; margin-top: 0.35rem; font-size: 0.78rem; }
    .links.panel {
      flex: 0 0 auto; margin-top: 0.4rem; padding-top: 0.35rem;
      border-top: 1px solid var(--line); gap: 0.3rem 0.65rem; font-size: 0.76rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .actions { display: flex; gap: 0.35rem; align-items: center; }
    .actions a.nav {
      color: var(--accent); font-size: 0.78rem; font-weight: 600; margin-right: 0.15rem;
    }
    button {
      background: var(--accent); color: #07111c; border: 0; border-radius: 6px;
      padding: 0.32rem 0.6rem; font-weight: 700; font-size: 0.78rem; cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
    footer {
      flex: 0 0 auto; color: var(--muted); font-size: 0.7rem;
      border-top: 1px solid var(--line); padding-top: 0.25rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    footer strong { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>La Nasa</h1>
      <p class="tagline">Fractanet control room · fleet · node zoom</p>
    </div>
    <div class="actions">
      <a class="nav" href="/simple.html" title="Status + useful links panel">Links page</a>
      <button id="refresh" type="button">Refresh</button>
      <button id="reload-page" class="secondary" type="button">Reload</button>
    </div>
  </header>
  <div id="flash" role="status" aria-live="polite"></div>
  <section class="grid">
    <article class="card" id="fleet-card">
      <h2>Fleet</h2>
      <div id="fleet" class="fleet-list"><span class="muted">Loading fleet…</span></div>
    </article>
    <article class="card" id="detail-card">
      <h2>Zoom</h2>
      <div id="detail" class="detail"><span class="muted">Select a node</span></div>
      <h2>Links</h2>
      <div class="links panel" id="useful-links">
        <a href="https://cogentia.fractavolta.com/" target="_blank" rel="noopener">Views Store</a>
        <a href="https://cogentia.fractavolta.com/docs" target="_blank" rel="noopener">Store docs</a>
        <a href="/simple.html">Simple home</a>
        <a href="/cgi-bin/home">No-JS home</a>
        <a href="/status.json">status.json</a>
        <a href="/cgi-bin/fleet">fleet JSON</a>
        <a href="/cgi-bin/refresh">Re-probe</a>
        <a href="http://127.0.0.1:8794/.well-known/soma" target="_blank" rel="noopener">Local SOMA</a>
        <a href="http://127.0.0.1:8794/node/status" target="_blank" rel="noopener">Local ONA</a>
      </div>
    </article>
  </section>
  <footer id="meta">Mesh-open ONA · no app auth on Tailscale</footer>
</main>
<script>
  var fleetEl = document.getElementById("fleet");
  var detailEl = document.getElementById("detail");
  var flash = document.getElementById("flash");
  var meta = document.getElementById("meta");
  var refreshBtn = document.getElementById("refresh");
  var fleetCard = document.getElementById("fleet-card");
  var selectedHost = null;
  var fleetData = null;

  function setFlash(text, kind) {
    flash.textContent = text || "";
    flash.className = kind || "";
  }

  function shortIso(iso) {
    if (!iso) return "?";
    var t = String(iso);
    var i = t.indexOf("T");
    return i >= 0 ? t.slice(i + 1).replace(/\.\d+/, "") : t;
  }

  function renderFleet(data) {
    fleetData = data;
    var nodes = (data && data.nodes) || [];
    if (!nodes.length) {
      fleetEl.innerHTML = '<span class="muted">No nodes</span>';
      return;
    }
    fleetEl.innerHTML = nodes.map(function (n) {
      var cls = n.online ? "ok" : "bad";
      var hs = n.health_score != null ? "h" + n.health_score : "";
      var sel = selectedHost === n.host ? " selected" : "";
      return (
        '<div class="node-row' + sel + '" role="button" tabindex="0" data-host="' + n.host + '">' +
        '<span class="dot ' + cls + '"></span>' +
        '<span class="name">' + (n.label || n.host) + "</span>" +
        '<span class="meta">' + (n.online ? "online " + hs : "offline") + "</span>" +
        "</div>"
      );
    }).join("");

    fleetEl.querySelectorAll(".node-row").forEach(function (row) {
      row.addEventListener("click", function () { selectNode(row.getAttribute("data-host")); });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectNode(row.getAttribute("data-host"));
        }
      });
    });
  }

  function findNode(host) {
    if (!fleetData || !fleetData.nodes) return null;
    for (var i = 0; i < fleetData.nodes.length; i++) {
      if (fleetData.nodes[i].host === host) return fleetData.nodes[i];
    }
    return null;
  }

  async function selectNode(host) {
    selectedHost = host;
    renderFleet(fleetData);
    var n = findNode(host);
    if (!n) {
      detailEl.innerHTML = '<span class="muted">Unknown node</span>';
      return;
    }
    detailEl.innerHTML = '<span class="muted">Loading ' + n.label + "…</span>";
    setFlash("Fetching " + n.host + "…", "busy");

    // Same-origin proxy — browser never calls peer :8794 (avoids CORS / DNS issues)
    try {
      var r = await fetch("/cgi-bin/node?host=" + encodeURIComponent(n.host) + "&t=" + Date.now(), {
        cache: "no-store",
      });
      if (!r.ok) throw new Error("proxy HTTP " + r.status);
      var pack = await r.json();
      if (!pack.ok) {
        paintDetailOffline(n, pack.error || "unreachable");
        setFlash(n.label + ": " + (pack.error || "unreachable"), "err");
        return;
      }
      paintDetail(n, pack.status, pack.object, pack.base);
      setFlash("OK " + n.label + " · " + shortIso(new Date().toISOString()), "ok");
    } catch (e) {
      paintDetailOffline(n, e.message);
      setFlash(n.label + ": " + e.message, "err");
    }
  }

  function attrVal(attrs, key) {
    if (!attrs || attrs[key] == null) return null;
    var a = attrs[key];
    if (a && typeof a === "object" && "value" in a) return a.value;
    return a;
  }

  function attrUnit(attrs, key) {
    if (!attrs || !attrs[key] || typeof attrs[key] !== "object") return null;
    return attrs[key].unit || null;
  }

  function fmtBytes(n) {
    var v = Number(n);
    if (!isFinite(v) || v < 0) return "?";
    var u = ["B", "KB", "MB", "GB", "TB"];
    var i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
    return (i === 0 ? String(Math.round(v)) : v.toFixed(v >= 10 ? 0 : 1)) + " " + u[i];
  }

  function fmtDuration(sec) {
    var s = Math.floor(Number(sec) || 0);
    if (s < 0) return "?";
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    if (d > 0) return d + "d " + h + "h";
    if (h > 0) return h + "h " + m + "m";
    if (m > 0) return m + "m " + (s % 60) + "s";
    return s + "s";
  }

  function fmtMs(ms) {
    if (ms == null || !isFinite(Number(ms))) return "—";
    return Math.round(Number(ms)) + " ms";
  }

  function chip(label, value, cls) {
    return (
      '<span class="chip' + (cls ? " " + cls : "") + '">' +
      '<span class="k">' + esc(label) + "</span>" +
      '<span class="v">' + esc(value) + "</span></span>"
    );
  }

  function probeClass(p) {
    if (!p || p.skipped) return "skip";
    if (p.ok === true) return "ok";
    if (p.ok === false) return "bad";
    return "";
  }

  function probeLabel(p) {
    if (!p) return "—";
    if (p.skipped) return "skip";
    if (p.ok === true) {
      return p.latency_ms != null ? fmtMs(p.latency_ms) : "ok";
    }
    if (p.ok === false) {
      var err = p.result && (p.result.error || p.result.status);
      if (err && typeof err === "object") err = err.message || err.code || JSON.stringify(err);
      if (p.result && p.result.status && !err) err = "HTTP " + p.result.status;
      return err ? String(err).slice(0, 28) : "fail";
    }
    return "?";
  }

  function healthBadge(hs, statusOk, online) {
    if (!online) return '<span class="badge bad">offline</span>';
    if (statusOk === false) return '<span class="badge warn">degraded</span>';
    if (statusOk === true) return '<span class="badge ok">healthy</span>';
    return '<span class="badge muted">unknown</span>';
  }

  function paintDetail(n, st, obj, base) {
    st = st || {};
    obj = obj || null;
    var attrs = (obj && obj.attributes) || {};
    var hs = st.health_score != null ? st.health_score : attrVal(attrs, "state.health");
    if (hs == null) hs = n.health_score;
    var hn = st.hostname || attrVal(attrs, "system.hostname") || n.hostname || n.host;
    var nid = st.node_id || (obj && obj.id) || n.resource_id;
    var label = n.label || attrVal(attrs, "core.user-label") || hn;
    var platform = attrVal(attrs, "system.platform");
    var arch = attrVal(attrs, "system.architecture");
    var uptime = attrVal(attrs, "system.uptime");
    if (uptime == null) uptime = st.uptime_seconds;
    var memTotal = attrVal(attrs, "system.memory.total");
    var memFree = attrVal(attrs, "system.memory.free");
    var operational = attrVal(attrs, "state.operational");
    var b = base || ("http://" + n.host + ":8794");
    var klass = (obj && obj.class) || "—";

    var html = '<div class="zoom-head">' +
      '<span class="zoom-title">' + esc(label) + "</span>" +
      healthBadge(hs, st.ok, n.online) +
      (hs != null ? '<span class="badge muted">h' + esc(hs) + "</span>" : "") +
      (operational ? '<span class="badge muted">' + esc(operational) + "</span>" : "") +
      '<p class="zoom-sub" title="' + esc(nid) + '">' + esc(hn) + " · " + esc(n.host) +
      (klass !== "—" ? " · " + esc(klass) : "") + "</p>" +
      "</div>";

    html += '<div class="sec"><h3>System</h3><div class="chips">' +
      chip("platform", (platform || "?") + (arch ? "/" + arch : "")) +
      chip("uptime", fmtDuration(uptime)) +
      chip("memory", memFree != null && memTotal != null
        ? fmtBytes(memFree) + " free / " + fmtBytes(memTotal)
        : memTotal != null ? fmtBytes(memTotal) : "—") +
      chip("ONA", st.ona_version || "?") +
      chip("peers", st.peer_count_fresh != null ? String(st.peer_count_fresh) : "—") +
      "</div></div>";

    // Probes from status items (preferred) or latest
    var probeItems = (st.probes && st.probes.items) || [];
    if (!probeItems.length && st.probes && st.probes.latest) {
      // collapse latest history to one per kind
      var seen = {};
      probeItems = [];
      (st.probes.latest || []).forEach(function (p) {
        var k = p.probe_kind || p.kind;
        if (k && !seen[k]) {
          seen[k] = true;
          probeItems.push({
            probe_kind: k,
            ok: p.ok === 1 || p.ok === true,
            skipped: false,
            latency_ms: p.latency_ms,
            target: p.target,
          });
        }
      });
    }
    if (probeItems.length) {
      html += '<div class="sec"><h3>Probes</h3><div class="chips">';
      probeItems.forEach(function (p) {
        var kind = p.probe_kind || p.kind || "probe";
        html += chip(kind, probeLabel(p), probeClass(p));
      });
      var fc = st.probes && st.probes.failed_count;
      if (fc != null) {
        html += chip("failed", String(fc), fc > 0 ? "bad" : "ok");
      }
      html += "</div></div>";
    }

    // Services = SOMA children
    var children = (obj && obj.children) || [];
    if (children.length) {
      html += '<div class="sec"><h3>Services</h3>';
      children.forEach(function (c) {
        var ca = c.attributes || {};
        var cname = attrVal(ca, "core.user-label") || (c.id || "").split("/").pop() || "service";
        var cop = attrVal(ca, "state.operational") || "?";
        var lat = attrVal(ca, "service.probe-latency");
        var okish = cop === "enabled" || cop === "online";
        html += '<div class="svc">' +
          '<span class="name">' + esc(cname) + "</span>" +
          '<span class="badge ' + (okish ? "ok" : "warn") + '">' + esc(cop) + "</span>" +
          '<span class="lat">' + esc(lat != null ? fmtMs(lat) : "—") + "</span>" +
          "</div>";
      });
      html += "</div>";
    }

    // Jobs summary
    var jobs = st.jobs || {};
    if (jobs.total != null) {
      html += '<div class="sec"><h3>Jobs</h3><div class="chips">' +
        chip("enabled", (jobs.enabled != null ? jobs.enabled : "?") + "/" + jobs.total) +
        chip("failed", String(jobs.failed_last_run != null ? jobs.failed_last_run : 0),
          jobs.failed_last_run > 0 ? "bad" : "ok") +
        "</div></div>";
    }

    html += '<div class="links">' +
      '<a href="' + esc(b) + '/.well-known/soma" target="_blank" rel="noopener">SOMA</a>' +
      '<a href="' + esc(b) + '/node/status" target="_blank" rel="noopener">status</a>' +
      '<a href="' + esc(b) + '/soma/object" target="_blank" rel="noopener">object</a>' +
      "</div>";

    // Raw (collapsed) — debug only
    var rawDump = JSON.stringify({ host: n.host, status: st, object: obj }, null, 0);
    html += '<details class="raw"><summary>Raw JSON</summary><pre>' +
      esc(rawDump.length > 1200 ? rawDump.slice(0, 1200) + "…" : rawDump) +
      "</pre></details>";

    detailEl.innerHTML = html;
  }

  function paintDetailOffline(n, err) {
    detailEl.innerHTML =
      '<div class="zoom-head">' +
      '<span class="zoom-title">' + esc(n.label || n.host) + "</span>" +
      '<span class="badge bad">unreachable</span>' +
      '<p class="zoom-sub">' + esc(n.host) + "</p></div>" +
      "<dl>" +
      "<dt>Error</dt><dd>" + esc(err || "offline") + "</dd>" +
      "</dl>" +
      '<p class="muted">Fleet list may still show online if only the zoom proxy failed.</p>';
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function loadFleet() {
    setFlash("Loading fleet…", "busy");
    refreshBtn.disabled = true;
    fleetCard.classList.add("pulse");
    try {
      var r = await fetch("/cgi-bin/fleet?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("fleet HTTP " + r.status);
      var data = await r.json();
      renderFleet(data);
      var online = (data.nodes || []).filter(function (n) { return n.online; }).length;
      var total = (data.nodes || []).length;
      meta.innerHTML =
        "Fleet <strong>" + online + "/" + total + "</strong> online · " +
        shortIso(data.generated_at) + " · mesh-pull";
      setFlash("Fleet " + online + "/" + total, "ok");
      if (selectedHost) selectNode(selectedHost);
      else if (data.nodes && data.nodes[0]) selectNode(data.nodes[0].host);
      return true;
    } catch (e) {
      // Fallback: coarse status.json only
      try {
        var r2 = await fetch("/status.json?t=" + Date.now(), { cache: "no-store" });
        var s = await r2.json();
        var nodes = [
          { host: "fracta", resource_id: "resource://fracta", label: "Fracta", online: !!(s.nodes && s.nodes.fracta), http_status: s.nodes && s.nodes.fracta ? 200 : 0, health_score: null, hostname: null, endpoint: "" },
          { host: "i7-thinkpad-jhr", resource_id: "resource://i7-thinkpad-jhr", label: "Workstation", online: !!(s.nodes && s.nodes.workstation), http_status: 0, health_score: null, hostname: null, endpoint: "" },
          { host: "rpi3-view", resource_id: "resource://rpi3-view", label: "This Pi", online: true, http_status: 200, health_score: null, hostname: null, endpoint: "" },
          { host: "poco-jhr", resource_id: "resource://poco-jhr", label: "Phone", online: !!(s.nodes && s.nodes.phone), http_status: 0, health_score: null, hostname: null, endpoint: "" },
        ];
        renderFleet({ nodes: nodes, generated_at: s.generated_at, mode: "status.json-fallback" });
        setFlash("Fleet degraded (status.json)", "busy");
        meta.textContent = "Degraded · " + shortIso(s.generated_at);
        return true;
      } catch (e2) {
        fleetEl.innerHTML = '<span class="muted">Fleet failed: ' + esc(e.message) + "</span>";
        setFlash(e.message, "err");
        return false;
      }
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Refresh";
      setTimeout(function () { fleetCard.classList.remove("pulse"); }, 300);
    }
  }

  refreshBtn.addEventListener("click", function () { loadFleet(); });
  document.getElementById("reload-page").addEventListener("click", function () { location.reload(); });

  loadFleet();
  setInterval(loadFleet, 60000);
</script>
</body>
</html>
