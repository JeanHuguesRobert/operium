<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Fractanet edge consultation portal on this Raspberry Pi">
  <title>Fractanet Edge Portal</title>
  <style>
    :root {
      --bg: #0b1118;
      --panel: #121c27;
      --line: #26384a;
      --text: #e8eef5;
      --muted: #91a4b7;
      --ok: #52d18b;
      --bad: #ff6b72;
      --accent: #73b7ff;
      --warn: #f0c14b;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* no page scroll on edge display */
    }
    body {
      background: linear-gradient(145deg, #0b1118, #101c28);
      color: var(--text);
      font: 14px/1.3 system-ui, sans-serif;
    }
    main {
      height: 100%;
      max-height: 100dvh;
      max-height: 100vh;
      width: 100%;
      margin: 0 auto;
      padding: 0.55rem 0.75rem 0.45rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.4rem;
      flex: 0 0 auto;
    }
    header .titles { min-width: 0; }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tagline {
      margin: 0.1rem 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    h2 {
      margin: 0 0 0.35rem;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .muted { color: var(--muted); }
    #flash {
      flex: 0 0 auto;
      min-height: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.2;
    }
    #flash.ok { color: var(--ok); }
    #flash.err { color: var(--bad); }
    #flash.busy { color: var(--warn); }
    .grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      overflow: hidden;
    }
    .card {
      background: rgba(18, 28, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.5rem 0.65rem;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .card.pulse {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(115, 183, 255, 0.45);
    }
    #health {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .status:last-child { border-bottom: 0; }
    .status strong { font-size: 0.82rem; }
    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
      display: inline-block;
    }
    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 8px rgba(82, 209, 139, 0.45);
    }
    .dot.bad { background: var(--bad); }
    a { color: var(--accent); text-decoration: none; }
    a:hover, a:focus { text-decoration: underline; }
    .links {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      overflow: hidden;
    }
    .link {
      display: block;
      padding: 0.28rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link:last-child { border-bottom: 0; }
    .link.muted {
      color: var(--muted);
      font-size: 0.78rem;
    }
    .actions { display: flex; gap: 0.35rem; align-items: center; flex: 0 0 auto; }
    button {
      background: var(--accent);
      color: #07111c;
      border: 0;
      border-radius: 6px;
      padding: 0.35rem 0.65rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    footer {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid var(--line);
      padding-top: 0.3rem;
    }
    footer strong { color: var(--text); font-weight: 600; }

    /* Very short viewports: slightly tighter */
    @media (max-height: 700px) {
      body { font-size: 13px; }
      h1 { font-size: 1.05rem; }
      .status, .link { padding-top: 0.2rem; padding-bottom: 0.2rem; }
    }
    /* Narrow: stack only if needed; keep single-page if possible */
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      html, body { overflow: auto; }
      main { max-height: none; height: auto; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="titles">
      <h1>Fractanet Edge Portal</h1>
      <p class="tagline">Local Pi · F11/Esc leave fullscreen · Super = system menu</p>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="reload-page" class="secondary" type="button" title="Full browser reload">Reload</button>
    </div>
  </header>
  <div id="flash" role="status" aria-live="polite"></div>

  <section class="grid" aria-label="Portal panels">
    <article class="card" id="health-card">
      <h2>Network</h2>
      <div id="health"><span class="muted">Loading snapshot…</span></div>
    </article>
    <article class="card">
      <h2>Links</h2>
      <div class="links">
        <a class="link" href="https://cogentia.fractavolta.com/">Cogentia Views Store</a>
        <a class="link" href="https://cogentia.fractavolta.com/docs">Views Store docs</a>
        <a class="link" href="https://github.com/JeanHuguesRobert/operium/issues/18">Operium roadmap</a>
        <a class="link" href="/status.json">status.json</a>
        <span class="link muted">Console · planned on Fracta</span>
      </div>
    </article>
  </section>

  <footer id="meta">Snapshot — · local page works without Internet</footer>
</main>
<script>
  const health = document.querySelector("#health");
  const healthCard = document.querySelector("#health-card");
  const meta = document.querySelector("#meta");
  const flash = document.querySelector("#flash");
  const refreshBtn = document.querySelector("#refresh");

  function row(label, value) {
    const ok = value === true;
    const state = value === null ? "?" : ok ? "ok" : "down";
    const cls = value === null ? "" : ok ? "ok" : "bad";
    return (
      '<div class="status">' +
      '<span class="dot ' + cls + '" aria-hidden="true"></span>' +
      '<span style="flex:1">' + label + "</span>" +
      "<strong>" + state + "</strong>" +
      "</div>"
    );
  }

  function setFlash(text, kind) {
    flash.textContent = text || "";
    flash.className = kind || "";
  }

  function shortIso(iso) {
    if (!iso) return "?";
    // 2026-07-30T12:34:56Z → 12:34:56Z
    var t = String(iso);
    var i = t.indexOf("T");
    return i >= 0 ? t.slice(i + 1).replace(/\.\d+/, "") : t;
  }

  function render(data, checkedAtIso, source) {
    health.innerHTML = [
      row("Views Store", data.services && data.services.views_store != null ? data.services.views_store : null),
      row("Fracta", data.nodes && data.nodes.fracta != null ? data.nodes.fracta : null),
      row("Workstation", data.nodes && data.nodes.workstation != null ? data.nodes.workstation : null),
      row("Phone", data.nodes && data.nodes.phone != null ? data.nodes.phone : null),
      row("This Pi", true),
    ].join("");
    var snap = (data && data.generated_at) || "?";
    meta.innerHTML =
      "Snap <strong>" + shortIso(snap) + "</strong> · check <strong>" + shortIso(checkedAtIso) +
      "</strong> · " + source + " · offline-safe";
  }

  async function loadCached() {
    const response = await fetch("/status.json?t=" + Date.now(), { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  }

  async function load(opts) {
    const reprobe = opts && opts.reprobe;
    const checkedAt = new Date().toISOString();
    healthCard.classList.add("pulse");
    try {
      let data;
      let source = "cache";
      if (reprobe) {
        setFlash("Re-probing…", "busy");
        refreshBtn.disabled = true;
        refreshBtn.textContent = "…";
        try {
          const response = await fetch("/cgi-bin/refresh?t=" + Date.now(), {
            cache: "no-store",
            method: "GET",
          });
          if (!response.ok) throw new Error("CGI " + response.status);
          data = await response.json();
          source = "probe";
        } catch (cgiErr) {
          data = await loadCached();
          source = "cache";
        }
      } else {
        data = await loadCached();
      }
      render(data, checkedAt, source);
      setFlash(reprobe ? "Updated " + shortIso(checkedAt) : "Loaded " + shortIso(data.generated_at), "ok");
      return true;
    } catch (error) {
      health.innerHTML = '<span class="muted">No status: ' + error.message + "</span>";
      setFlash("Failed: " + error.message, "err");
      meta.textContent = "Check failed " + shortIso(checkedAt);
      return false;
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Refresh";
      setTimeout(function () { healthCard.classList.remove("pulse"); }, 400);
    }
  }

  refreshBtn.addEventListener("click", function () { load({ reprobe: true }); });
  document.querySelector("#reload-page").addEventListener("click", function () {
    setFlash("Reloading…", "busy");
    location.reload();
  });

  function tryBrowserFullscreen() {
    // Content fullscreen (complements Firefox --kiosk / labwc fullscreen).
    var el = document.documentElement;
    if (!el || document.fullscreenElement) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) {
      try { req.call(el); } catch (e) { /* needs gesture on some builds */ }
    }
  }

  (async function firstLoad() {
    for (var i = 0; i < 8; i++) {
      if (await load({ reprobe: false })) {
        setTimeout(tryBrowserFullscreen, 400);
        return;
      }
      setFlash("Waiting… " + (i + 1), "busy");
      await new Promise(function (r) { setTimeout(r, 1500); });
    }
  })();
  setInterval(function () { load({ reprobe: false }); }, 60000);
</script>
</body>
</html>
