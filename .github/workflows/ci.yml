name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operium
        uses: actions/checkout@v4
        with:
          path: operium

      - name: Checkout cogentia (workspace sibling)
        uses: actions/checkout@v4
        with:
          repository: JeanHuguesRobert/cogentia
          path: cogentia

      - name: Checkout inseme (workspace sibling)
        uses: actions/checkout@v4
        with:
          repository: JeanHuguesRobert/inseme
          ref: 71b9e7e6b5c8c9cbf0cd03973a77c346e85d65f6
          path: inseme

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: operium/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Install Operium dependencies (supervised)
        id: operium-install
        continue-on-error: true
        working-directory: operium
        run: |
          node ../inseme/scripts/ops/supervise-result.js --out ../ci-evidence/operium-install --phase install -- npm ci
          node -e 'const r=require("../ci-evidence/operium-install/result.json");process.exit(r.passed?0:1)'

      - name: Install Cogentia runtime dependencies (supervised)
        id: cogentia-install
        continue-on-error: true
        working-directory: operium
        if: steps.operium-install.outcome == 'success'
        run: |
          node ../inseme/scripts/ops/supervise-result.js --out ../ci-evidence/cogentia-install --phase install -- pnpm --dir ../cogentia install --prod --frozen-lockfile --ignore-scripts
          node -e 'const r=require("../ci-evidence/cogentia-install/result.json");process.exit(r.passed?0:1)'

      - name: Run tests (supervised)
        continue-on-error: true
        working-directory: operium
        if: steps.operium-install.outcome == 'success' && steps.cogentia-install.outcome == 'success'
        id: tests
        run: |
          node ../inseme/scripts/ops/supervise-result.js --out ../ci-evidence/tests --phase test -- npm test
          node -e 'const r=require("../ci-evidence/tests/result.json");process.exit(r.passed?0:1)'

      - name: Preserve install and test outcomes
        if: always()
        shell: bash
        run: |
          set -e
          for phase in operium-install cogentia-install tests; do
            result="ci-evidence/$phase/result.json"
            if [ -f "$result" ] && node -e 'const r=require("./"+process.argv[1]);process.exit(r.passed?0:1)' "$result"; then
              continue
            elif [ -f "$result" ]; then
              cp "$result" "ci-evidence/result.json"
              cp "ci-evidence/$phase/test.log" "ci-evidence/test.log" 2>/dev/null || true
              exit 0
            else
              printf '{"schema":"fbf.supervised-result/v1","phase":"%s","passed":false,"status":"not_run"}\n' "$phase" > ci-evidence/result.json
              exit 0
            fi
          done
          printf '{"schema":"fbf.supervised-result/v1","phase":"complete","passed":true,"status":"completed"}\n' > ci-evidence/result.json

      - name: Upload CI task result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: operium-ci-result
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
