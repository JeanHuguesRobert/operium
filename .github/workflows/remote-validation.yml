name: Remote validation snapshot conformance

on:
  push:
    branches: [main]
    paths:
      - "scripts/ops/remote-validation-worker.py"
      - "scripts/ops/validate-remote.py"
      - "scripts/test-remote-validation.py"
      - "scripts/ops/supervise-ci-result.js"
      - ".github/workflows/remote-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ops/remote-validation-worker.py"
      - "scripts/ops/validate-remote.py"
      - "scripts/test-remote-validation.py"
      - "scripts/ops/supervise-ci-result.js"
      - ".github/workflows/remote-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify archive identity, extraction, deadline and dry-run preflight
        run: |
          node scripts/ops/supervise-ci-result.js --out ci-evidence/remote-validation --phase snapshot-boundary --timeout-ms 240000 -- python3 scripts/test-remote-validation.py
          node -e 'const fs=require("node:fs");const r=JSON.parse(fs.readFileSync("ci-evidence/remote-validation/result.json"));process.exit(r.passed?0:1)'
      - name: Preserve typed result and synthetic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-validation-snapshot-result
          path: ci-evidence/remote-validation/
          if-no-files-found: warn
          retention-days: 14
