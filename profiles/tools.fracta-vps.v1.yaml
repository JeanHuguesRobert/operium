# Desired tooling — fracta public VPS (~1GB RAM)
# See: docs/workstation-tooling-debt-and-profiles.md, docs/fracta-trust-perimeter.md

profile_id: tools.fracta-vps.v1
node_class: fracta-vps
ssh_alias: fracta
updated: "2026-07-29"
policy:
  install_mode: user-or-system-apt
  forbid_sudo_npm_global: true
  docker_supabase_stack: forbidden  # RAM + role mismatch
  role: public_guide_control_plane_and_coding_node
shell_profile: profiles/shell/fracta-vps.profile.sh
shell_install: profiles/shell/install-fracta-vps-shell-profile.sh

tools:
  - id: node
    desired:
      path_command: node
      min_version: "20"
    priority: 1
    status: present  # observed v26.5.0 on 2026-07-19

  - id: npm
    desired:
      path_command: npm
    priority: 1
    status: present

  - id: codex
    desired:
      path_command: codex
      install: user
    auth: native ChatGPT auth file
    priority: 1
    status: present  # standalone 0.144.5 observed 2026-07-28

  - id: claude-code
    desired:
      path_command: claude
      install: user_npm
    auth: native claude.ai OAuth credentials
    priority: 1
    status: present  # 2.1.220 observed 2026-07-28

  - id: grok-build
    desired:
      path_command: grok
      install: official_user_installer
      source: https://x.ai/cli/install.sh
    auth: native OIDC auth file
    priority: 1
    status: present  # 0.2.112 observed and model listing verified 2026-07-28

  - id: supabase-cli
    desired:
      path_command: supabase
      install: optional_user_binary  # ~/.local/bin — only if migrations ever run from VPS
    default: skip
    notes: Prefer running migrations from workstation; VPS is not the migration host
    requires_auth: true
    requires_docker: false
    priority: 3
    status: absent_by_design

  - id: docker
    desired: absent
    reason: low RAM; not the local Supabase host
    priority: 1
    status: absent_ok

secrets_refs:
  - path_hint: /srv/cogentia/secrets/
    rule: never_github
    doc: docs/fracta-trust-perimeter.md

shared_store:
  schema: operium.shared-store.v1
  status: present
  observed: "2026-07-28"
  transport: sftp
  ssh_alias: fracta
  path: /srv/operium-store
  owner: ubuntu
  group: ubuntu
  mode: "0700"
  public: false
  runbook: docs/operium-shared-store.md
