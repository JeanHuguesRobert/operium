# Desired developer tooling — Windows workstation (user-space first)
# Schema: informal v0.1 — evolve toward operium.tools.profile.v1
# See: docs/workstation-tooling-debt-and-profiles.md

profile_id: tools.workstation-windows.v1
node_class: workstation-windows
updated: "2026-08-07"
policy:
  install_mode: user-space
  forbid_admin_npm_global: true
  npm_global_under_program_files: forbidden
  preferred_windows_provider: scoop

tools:
  - id: postgresql-client
    purpose: Direct TLS PostgreSQL migrations for the JHN Supabase project
    desired:
      provider: scoop
      package: postgresql
      path_command: psql
      min_version: "17"
    requires_docker: false
    requires_auth: false
    server_must_remain_stopped: true
    priority: 1
    status: present
    observed_version: "18.4"
    observed_at: "2026-08-07"
    observed_path: "C:\\Users\\admin\\.local\\bin\\psql.ps1"
    observation: >
      Scoop lists postgresql as Install failed but binaries exist under
      apps/postgresql/18.4-2/pgsql/bin. User-space shims via
      ensure-psql-client.ps1 → %USERPROFILE%\.local\bin.
    remediation: |
      pwsh -File scripts/ops/ensure-psql-client.ps1
      # Use psql only; do not register or start a local PostgreSQL server.

  - id: supabase-cli
    purpose: Cloud Supabase link / migrations / projects (not local Docker stack)
    desired:
      provider: scoop
      package: supabase
      path_command: supabase
      min_version: "2.100.0"
    forbidden:
      - "npm install -g supabase under Program Files"
    requires_docker: false
    requires_auth: true
    priority: 1
    status: present
    observed_version: "2.109.1"
    observed_at: "2026-08-07"
    observed_path: "C:\\Users\\admin\\scoop\\shims\\supabase.exe"
    observation: Scoop shim authoritative; Program Files npm residue gone
    remediation: |
      pwsh -File scripts/ops/ensure-supabase-cli.ps1
      # optional once elevated: remove Program Files\nodejs\node_modules\supabase

  - id: git
    desired:
      provider: scoop_or_system
      path_command: git
    priority: 1
    status: present
    observed_at: "2026-08-07"
    observed_path: "C:\\Program Files\\Git\\cmd\\git.exe"

  - id: gh
    desired:
      provider: scoop_or_msi
      path_command: gh
    priority: 2
    status: present
    observed_at: "2026-08-07"
    observed_path: "C:\\Program Files\\GitHub CLI\\gh.exe"
    notes: MSI under Program Files is acceptable (not npm admin global)

  - id: netlify-cli
    desired:
      provider: user_npm_or_pnpm_dlx
      path_command: netlify
      min_version: "27.1.0"
    forbidden:
      - "npm install -g netlify-cli with prefix under Program Files"
    notes: User npm prefix is authoritative; authenticate from JHN vault without committing the token
    requires_auth: true
    priority: 2
    status: present_with_legacy_shadow
    observed_version: "27.1.0"
    observed_at: "2026-08-07"
    observed_path: "C:\\Users\\admin\\.npm-global\\netlify.ps1"
    observation: >
      User install 27.1.0 present. Legacy Program Files 23.10.0 may win in
      -NoProfile sessions; interactive Operium shell profile and
      ensure-user-npm-prefix.ps1 put user prefix first (OP-BUG-004).
    known_risk: OpenSSH service env may need refresh to drop legacy first-hit
    remediation: |
      pwsh -File scripts/ops/ensure-user-npm-prefix.ps1
      node scripts/ops/audit-tools.js --human --only netlify-cli

  - id: pnpm
    desired:
      provider: corepack_or_scoop
      path_command: pnpm
    priority: 1
    status: present
    observed_at: "2026-08-07"
    observed_path: "C:\\Program Files\\nodejs\\pnpm.ps1"
    notes: >
      Runtime may ship with Node under Program Files; do not npm -g install
      other tools into that prefix. User prefix is enforced for new globals.

  - id: node
    desired:
      provider: system_or_fnm
      path_command: node
    notes: Runtime may stay system; avoid npm -g into Program Files
    priority: 1
    status: present
    observed_at: "2026-08-07"
    observed_path: "C:\\Program Files\\nodejs\\node.exe"

  - id: docker
    desired:
      provider: optional
      path_command: docker
    notes: Not required for remote supabase db push; needed only for supabase start
    priority: 3
    status: absent

  - id: claude-code
    purpose: Interactive coding agent (Claude Code CLI)
    desired:
      path_command: claude
      mode_tool: operium/scripts/ops/claude-mode.js
      default_mode: pro
      modes:
        pro:
          auth: claude_ai_oauth
          settings: "~/.claude/settings.json without ANTHROPIC_BASE_URL/AUTH_TOKEN"
          login: "claude auth login"
        zai:
          auth: ZAI_API_KEY from inseme/.env
          base_url: "https://api.z.ai/api/anthropic"
      apply_mesh: scripts/ops/apply-claude-mode-nodes.ps1
    forbidden:
      - "Require ANTHROPIC_API_KEY Console key for default interactive use"
      - "Store OAuth refresh tokens in git"
    priority: 1
    status: present
    observed_at: "2026-08-07"
    observed_path: "C:\\Users\\admin\\.npm-global\\claude.ps1"
    observed_version: "2.1.224"
    observation: Reinstalled under user npm prefix (OP-BUG-004); legacy Program Files shim may remain
    doc: docs/claude-code-mode.md

  - id: winfsp
    purpose: User-space filesystem layer for the Fracta SFTP network drive
    desired:
      provider: winget
      package: WinFsp.WinFsp
    priority: 1
    status: present
    observed_version: "2.1.25156"

  - id: rclone
    purpose: Mount and synchronize the private Operium store over SFTP
    desired:
      provider: winget
      package: Rclone.Rclone
      path_command: rclone
    priority: 1
    status: present
    observed_version: "1.74.4"
    remote: fracta-store
    remote_path: /srv/operium-store
    current_mount: "H:"
    persistence: scheduled_task_at_logon
    scheduled_task: Operium-Fracta-Store
    log: "%LOCALAPPDATA%/Operium/logs/rclone-fracta-store.log"
    doc: docs/operium-shared-store.md

exceptions_admin_ok:
  - id: ona-windows-service
    reason: NSSM/Windows service install requires elevation once
    doc: docs/operium-node-agent-install.md
